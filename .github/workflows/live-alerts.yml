name: Live-stream alerts

# Vercel's Hobby cron can only run once a day, so the "are we live yet?"
# poll lives here: every 5 minutes in windows around each scheduled service
# (UTC, wide enough to cover both EST and EDT). The site's own
# /api/live-alerts/send re-verifies that a stream is actually live and
# recently started before emailing anyone — this workflow only decides
# WHEN to ask, and remembers (via the Actions cache) which stream it has
# already sent for, so each stream gets exactly one alert.
on:
  schedule:
    - cron: "*/5 13-18 * * 0"   # Sunday morning: Family School 9:45 + 11:00 service
    - cron: "*/5 21-23 * * 0"   # Sunday evening 6:00 service
    - cron: "*/5 22-23 * * 3"   # Wednesday 7:00 service (EDT)
    - cron: "*/5 0 * * 4"       # Wednesday 7:00 service (EST, = 00:00 UTC Thursday)
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: live-alerts
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Ask the site whether we're live
        id: live
        run: |
          json=$(curl -sf --max-time 30 https://fbcchelsea.org/api/live || echo '{}')
          echo "site said: $json"
          echo "show=$(echo "$json" | jq -r '.show // false')" >> "$GITHUB_OUTPUT"
          echo "videoId=$(echo "$json" | jq -r '.videoId // empty')" >> "$GITHUB_OUTPUT"

      - name: Already alerted for this stream?
        if: steps.live.outputs.show == 'true' && steps.live.outputs.videoId != ''
        id: seen
        uses: actions/cache/restore@v4
        with:
          path: .live-alert-marker
          key: live-alert-${{ steps.live.outputs.videoId }}
          lookup-only: true

      - name: Send the alert
        if: steps.live.outputs.show == 'true' && steps.live.outputs.videoId != '' && steps.seen.outputs.cache-hit != 'true'
        id: send
        run: |
          curl -sf --max-time 55 -X POST https://fbcchelsea.org/api/live-alerts/send \
            -H "Authorization: Bearer ${{ secrets.LIVE_ALERT_SECRET }}" \
            -H "Content-Type: application/json" \
            -d "{\"videoId\":\"${{ steps.live.outputs.videoId }}\"}" | tee result.json
          echo "sent for ${{ steps.live.outputs.videoId }} at $(date -u)" > .live-alert-marker

      - name: Remember this stream
        if: steps.send.outcome == 'success'
        uses: actions/cache/save@v4
        with:
          path: .live-alert-marker
          key: live-alert-${{ steps.live.outputs.videoId }}
