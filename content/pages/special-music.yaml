title: Special Music
eyebrow: Choir & Orchestra
intro: >-
  A beautiful blend — old hymns and newer spiritual songs, sung and played by
  our own people. The choir is a blessing every single Sunday.
description: >-
  The choir and orchestra of Faith Baptist Church of Chelsea — and how to join
  them. No audition required; just talk to Matthew Dowdy.
menu: none
menuOrder: 99
sections:
  - discriminant: text
    value:
      heading: Hear it for yourself
      body: ''
      tint: false
  - discriminant: video
    value:
      url: https://youtu.be/Dzq5IOGRBDI
  - discriminant: imageText
    value:
      heading: Anyone can join. We mean that literally.
      body: >
        No audition. No tryout. No music degree. If you can carry a tune — or
        used to play an instrument and think you’re too rusty — the seat is
        already there. Simply speak with **Matthew Dowdy**, our music director.


        Matthew has a music degree and more than a decade of directing
        experience, and he’d rather have a willing voice than a perfect one.
      image: /images/pages/special-music/sections/2/value/image.jpg
      imageSide: right
      tint: true
  - discriminant: image
    value:
      image: /images/pages/special-music/sections/3/value/image.jpg
      caption: The orchestra playing on a Sunday
  - discriminant: text
    value:
      heading: Want in?
      body: >
        Tell us you’re interested and Matthew will find you on Sunday. That’s
        the whole process.
      tint: false
  - discriminant: buttons
    value:
      buttons:
        - label: I want to join the choir or orchestra
          link: /contact
          style: primary
